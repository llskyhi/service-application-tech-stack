quarkus:
  profile:
    - dev
    # - datasource-credential-password
    - datasource-credential-vault
    - authentication-oidc
    # - authentication-oidc-credential-environment-variables
    # - authentication-oidc-credential-vault-credentials-provider
    - authentication-oidc-credential-vault-secret-config
  datasource:
    db-kind: postgresql
    jdbc:
      url: jdbc:postgresql://localhost:5432/sats
  hibernate-orm:
    schema-management:
      strategy: update
  http:
    auth:
      permission:
        sats-public:
          paths: /hello, /auth/logout, /auth/post-logout
          policy: permit
        sats-authenticated:
          paths: /*
          policy: authenticated
  keycloak:
    devservices:
      enabled: false
  # https://docs.quarkiverse.io/quarkus-vault/dev/index.html
  vault:
    url: ${SATS_OPENBAO_ADDR}
    # The (only) KV secret engine mount path.
    # Seems currently it's not allowed to use multiple KV engine path;
    # but it may be reasonable to organize all secrets used by an application in single KV engine?
    kv-secret-engine-mount-path: sats/kv
    authentication:
      app-role:
        auth-mount-path: sats-approle
        role-id: 01234567-89ab-cdef-0123-456789abcdef
        secret-id: fedcba98-7654-3210-fedc-ba9876543210
      # userpass:
      #   auth-mount-path: sats-userpass
      #   username: sats-user
      #   password: sats-pass
      # client-token: ${SATS_OPENBAO_DEV_TOKEN}
